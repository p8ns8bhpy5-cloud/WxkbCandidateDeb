name: Build WxkbCandidate

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
      - name: Deps
        run: brew install ldid dpkg xz
      - name: Build
        run: |
          make package FINALPACKAGE=1
          find ./packages -name "*.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: wxkbcandidate-deb
          path: ./packages/*.deb
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v1.0.0-${{ github.run_number }}
          files: ./packages/*.deb

